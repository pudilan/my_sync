# my_sync configuration (copy to config.yaml)
# The web UI login is set via env only: MYSYNC_UI_USER, MYSYNC_UI_PASSWORD

# Web UI listen address (change requires restart).
listen: ":8080"

# Output directory. Each backup run with changes creates a sub directory
# YYYYMMDD-HHMMSS/ containing the zip volumes and index.json (the database).
dest: /backups

# Archive name prefix: <prefix>_<backup id>_001.zip
prefix: backup

# Directories to back up. "name" becomes the top-level folder inside the
# archives (defaults to the directory name).
sources:
  - name: docs
    path: /data/docs
  - name: photos
    path: /data/photos

# Exclude patterns. Without "/" they match any file/dir name at any depth;
# with "/" they match the path relative to the source root.
excludes:
  - .DS_Store
  - .localized
  - Thumbs.db
  - "*.tmp"
  - "~$*"
  - node_modules

# Archive password; empty disables encryption.
password: ""
# aes256: 7-Zip (7zz), WinRAR, Bandizip, Keka, The Unarchiver. Not supported
#   by Info-ZIP `unzip` (macOS/Linux default, "unsupported compression method
#   99"), macOS Archive Utility or Windows Explorer.
# zipcrypto: weak, but every zip tool including `unzip` and Explorer opens it.
encryption: aes256

# auto: store already compressed formats (jpg, mp4, zip, dmg, docx, pdf, ...)
#       as is and deflate everything else (recommended)
# deflate: deflate every file; store: no compression at all.
# In all modes a small file that does not shrink is stored as is.
compression: auto
# Deflate level 1 (fastest) .. 9 (smallest).
compression_level: 5
# Files compressed/encrypted in parallel; 0 = number of CPUs.
workers: 0

# Maximum size of each zip volume, e.g. 500MB, 4GB. Empty or 0 = no split.
# Every volume is a complete zip that can be extracted on its own; a single
# file larger than this gets a volume of its own.
volume_size: 1GB

# Maximum archive bytes written by a single backup run, e.g. 50GB. Changed
# files that do not fit are left for the next run, so a large initial backup
# can be spread over several runs when disk space is short. Empty or 0 = no
# limit. A single file larger than this cannot be backed up.
max_backup_size: ""

# Automatic backups: empty = off, "6h" / "30m" = interval, "02:30" = daily.
schedule: "02:30"
